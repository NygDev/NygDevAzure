name: Terraform Import

# One-shot. Adopts two things that were created by hand into terraform state:
# the `data` container on nygdevcdn, and the Storage Blob Data Contributor
# assignment on it for id-nygdev-api.
#
# Both are declared in the configuration — terraform/cdn.tf and
# terraform/consumption.tf — but neither azurerm_storage_container nor
# azurerm_role_assignment adopts something that already exists. Each fails the
# apply instead. So the state has to be told about them once, and this is that
# once.
#
# Delete this workflow after it has run green. It is a migration rather than a
# pipeline: from then on the ordinary Terraform Apply workflow manages both
# like everything else. Re-running it in the meantime is harmless — each import
# checks the state first and skips what is already there — but there is nothing
# left for it to do.
#
# It deliberately does not apply anything. The last step is a plan, and reading
# it is the point: it is where a container that was made private rather than
# publicly readable shows up, as a change to container_access_type.

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    env:
      ARM_USE_OIDC: "true"
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_entra_owner_objectid: ${{ secrets.ENTRA_OWNER_OBJECTID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v5

      - name: 'Az CLI login'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false

      # Import evaluates the whole configuration, so the variables that have no
      # default have to be supplied here exactly as the apply workflow supplies
      # them — otherwise terraform stops to prompt for them and the job hangs.
      - name: 'Retrieve Home IP from Key Vault'
        run: |
          HOME_IP=$(az keyvault secret show \
            --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} \
            --name HomeIP \
            --query value \
            --output tsv)
          echo "::add-mask::$HOME_IP"
          echo "HOME_IP=$HOME_IP" >> $GITHUB_ENV

      - name: 'Retrieve SSH Public Key'
        run: |
          SSH_KEY=$(az sshkey show \
            --resource-group rg-nygdev-security \
            --name nygdev-ed25519 \
            --query publicKey \
            --output tsv)
          echo "SSH_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-tf-

      - name: 'Terraform Init'
        working-directory: terraform
        run: terraform init

      # Both ids are looked up rather than written down. The container id is
      # derived from the account's own id so it cannot disagree with it, and
      # the role assignment's name is a GUID Azure chose when the assignment
      # was made — there is nothing to hardcode even if we wanted to.
      - name: 'Find what there is to adopt'
        working-directory: terraform
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(az storage account show --name nygdevcdn --query id --output tsv)
          CONTAINER_ID="$ACCOUNT_ID/blobServices/default/containers/data"

          PRINCIPAL_ID=$(az identity list \
            --query "[?name=='id-nygdev-api'].principalId | [0]" --output tsv)

          if [ -z "$PRINCIPAL_ID" ] || [ "$PRINCIPAL_ID" = "null" ]; then
            echo "::error::Could not find the id-nygdev-api user-assigned identity in this subscription."
            exit 1
          fi

          # What the container's public access actually is. Printed because the
          # configuration says "blob", and the difference between that and
          # anything else is the difference between the published URL being
          # readable by a browser and not.
          ACCESS=$(az storage container-rm show \
            --storage-account nygdevcdn --name data \
            --query publicAccess --output tsv 2>/dev/null || true)

          echo "data container public access: ${ACCESS:-None}"

          if [ "$ACCESS" != "Blob" ]; then
            echo "::warning::The data container's public access is '${ACCESS:-None}', not 'Blob'. terraform/cdn.tf declares blob-level anonymous read, so the plan below will show a change to container_access_type; until that is applied the published URL is not readable by a browser."
          fi

          ROLE_QUERY="[?principalId=='$PRINCIPAL_ID' && roleDefinitionName=='Storage Blob Data Contributor'].id | [0]"

          ROLE_ID=$(az role assignment list --scope "$CONTAINER_ID" --query "$ROLE_QUERY" --output tsv)

          if [ -z "$ROLE_ID" ] || [ "$ROLE_ID" = "null" ]; then
            # Not on the container. The other place it is commonly granted is
            # the whole account — which is what the azadmin app holds, so it is
            # an easy pattern to have copied. Importing that into a
            # container-scoped resource would queue a destroy and recreate on
            # the next apply, silently narrowing a grant somebody may have
            # meant to be broad. Stop, and let a person decide instead.
            ACCOUNT_ROLE_ID=$(az role assignment list --scope "$ACCOUNT_ID" --query "$ROLE_QUERY" --output tsv)

            if [ -n "$ACCOUNT_ROLE_ID" ] && [ "$ACCOUNT_ROLE_ID" != "null" ]; then
              echo "::error::id-nygdev-api holds Storage Blob Data Contributor on the whole nygdevcdn account, not on the data container, and terraform/consumption.tf declares it container-scoped. Nothing was imported. Either delete the account-scoped assignment and re-run, letting terraform create the container-scoped one, or change the scope in consumption.tf to the account and re-run."
              exit 1
            fi

            echo "::error::No Storage Blob Data Contributor assignment for id-nygdev-api was found on the data container or on the nygdevcdn account. Grant it on the container and re-run, or drop the resource from consumption.tf and let an apply create it."
            exit 1
          fi

          echo "container: $CONTAINER_ID"
          echo "assignment: $ROLE_ID"

          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          echo "ROLE_ID=$ROLE_ID" >> $GITHUB_ENV

      # Guarded so a second run is a no-op rather than an error: terraform
      # refuses to import over an address it already manages.
      - name: 'Import the data container'
        working-directory: terraform
        run: |
          set -euo pipefail

          if grep -qxF 'azurerm_storage_container.data' <<< "$(terraform state list)"; then
            echo "azurerm_storage_container.data is already in state; nothing to do."
            exit 0
          fi

          terraform import \
            -var="home_ip=$HOME_IP" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_username=${{ secrets.AZURE_VM_USERNAME }}" \
            azurerm_storage_container.data "$CONTAINER_ID"

      - name: 'Import the blob contributor assignment'
        working-directory: terraform
        run: |
          set -euo pipefail

          if grep -qxF 'azurerm_role_assignment.api_cdn_data' <<< "$(terraform state list)"; then
            echo "azurerm_role_assignment.api_cdn_data is already in state; nothing to do."
            exit 0
          fi

          terraform import \
            -var="home_ip=$HOME_IP" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_username=${{ secrets.AZURE_VM_USERNAME }}" \
            azurerm_role_assignment.api_cdn_data "$ROLE_ID"

      # The point of the run. Read this before applying anything: neither
      # imported resource should be replaced, and if container_access_type is
      # changing, that is the container having been made private.
      - name: 'Terraform Plan'
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="home_ip=$HOME_IP" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_username=${{ secrets.AZURE_VM_USERNAME }}"
