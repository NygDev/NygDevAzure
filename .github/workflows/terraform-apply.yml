name: Terraform Apply

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    env:
      ARM_USE_OIDC: "true"
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_entra_owner_objectid: ${{ secrets.ENTRA_OWNER_OBJECTID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v7

      - name: 'Az CLI login'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: 'Retrieve Home IP from Key Vault'
        run: |
          HOME_IP=$(az keyvault secret show \
            --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} \
            --name HomeIP \
            --query value \
            --output tsv)
          echo "::add-mask::$HOME_IP"
          echo "HOME_IP=$HOME_IP" >> $GITHUB_ENV

      - name: 'Retrieve SSH Public Key'
        run: |
          SSH_KEY=$(az sshkey show \
            --resource-group rg-nygdev-security \
            --name nygdev-ed25519 \
            --query publicKey \
            --output tsv)
          echo "SSH_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-tf-

      # The two gym blobs are uploaded gzipped (see terraform/cdn.tf). The
      # readable JSON in gym/ is the source of truth; this makes the copy
      # terraform uploads and takes content_md5 from. -n drops the name and
      # timestamp, so unchanged JSON gzips to unchanged bytes and the blobs are
      # not rewritten on every apply.
      - name: 'Gzip the CDN JSON'
        run: |
          mkdir -p gym/dist
          for f in exercises templates; do
            gzip -n -9 -c "gym/$f.json" > "gym/dist/$f.json.gz"
          done

      - name: 'Terraform Init'
        working-directory: terraform
        run: terraform init

      - name: 'Terraform Apply'
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="home_ip=$HOME_IP" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_username=${{ secrets.AZURE_VM_USERNAME }}"

      # azurerm_storage_blob cannot set Content-Encoding, so the gzipped CDN
      # JSON gets it here (see terraform/cdn.tf). Runs on every apply because a
      # re-upload clears it. Set Blob Properties replaces every content header,
      # so the ones terraform set are passed again unchanged — the MD5 among
      # them, or the next plan would see it gone and upload the blob again.
      - name: 'Mark the CDN JSON as gzip'
        run: |
          for f in exercises templates; do
            az storage blob update \
              --account-name nygdevcdn \
              --auth-mode login \
              --container-name data \
              --name "gym-$f.json" \
              --content-type application/json \
              --content-encoding gzip \
              --content-cache-control 'public, max-age=86400' \
              --content-md5 "$(openssl md5 -binary "gym/dist/$f.json.gz" | base64)"
          done
