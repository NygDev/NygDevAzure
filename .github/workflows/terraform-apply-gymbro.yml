name: Terraform Apply (gymbro)

# The gymbro slice of this configuration, applied on its own.
#
# What gymbro.nygard.dev needs on the Azure side is two things, and they are in
# two different files: the Static Web App it is served from
# (terraform/staticsites.tf) and the api function app's CORS list, which has to
# name its origin (terraform/consumption.tf). The ordinary Terraform Apply
# workflow applies both — along with the VM, the network, the SQL server and
# everything else — so shipping a planner change through it means putting the
# whole estate in the blast radius of a front-end concern.
#
# This one narrows that with -target. Read the two caveats below before using
# it; they are the reason HashiCorp calls -target an exceptional tool rather
# than a routine one.
#
# **-target pulls in dependencies, so this is wider than two resources.**
# The api function app depends on its service plan, its storage account and
# container, App Insights, the user-assigned identity, and — through
# COSMOS_ENDPOINT — the Cosmos account. All of those join the graph. What stays
# out is the VM, the network and NSG, the SQL server, the CDN blobs, the azadmin
# function app and the other three Static Web Apps. The plan step is where you
# see what it actually came to; it is printed rather than summarised for that
# reason.
#
# **-target excludes dependents, and two of them are grants.**
# azurerm_cosmosdb_sql_role_assignment.api_cosmos and
# azurerm_role_assignment.api_cdn_data depend on the api function app, so they
# are *not* in a graph targeted at it. That is harmless while the function app
# is only updated in place. If a plan here ever shows the function app or its
# identity being replaced, stop and run the full Terraform Apply instead — a
# replaced principal with no re-granted role reaches the app as a 403 from
# Cosmos at run time, not as a failure in this job.
#
# Deploying the site's *content* is a different pipeline in a different
# repository: .github/workflows/deploy-gymbro.yml in nygdevweb builds
# sites/gymbro and uploads it to the Static Web App this workflow provisions.
# Nothing here touches what is served; this is the resource, not the site.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan only, or plan and then apply it'
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read

# Against itself only. The real contention is with the Terraform Apply workflow,
# which holds the same backend lock on the same state key — that one is handled
# by -lock-timeout below, since a second workflow's runs are not in this group.
concurrency:
  group: terraform-gymbro
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    env:
      ARM_USE_OIDC: "true"
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_entra_owner_objectid: ${{ secrets.ENTRA_OWNER_OBJECTID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      # The whole definition of "the gymbro slice", in one place so the plan and
      # the plan file cannot disagree about it. Expanded unquoted below, which is
      # safe here and only here: these are two flags with no whitespace in them.
      TF_TARGETS: >-
        -target=azurerm_static_web_app.nygdevgymbro
        -target=azurerm_function_app_flex_consumption.api

      # The state is shared with Terraform Apply. Without this a run that
      # overlaps one fails immediately on "Error acquiring the state lock"; with
      # it, it waits for the other to finish, which is nearly always what was
      # wanted.
      TF_LOCK_TIMEOUT: 5m
    steps:
      - uses: actions/checkout@v7

      - name: 'Az CLI login'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Targeting narrows the *graph*, not the *variables*: terraform still
      # evaluates the whole configuration, so every variable without a default
      # has to be supplied exactly as the apply workflow supplies it. Omitting
      # these because "gymbro has no VM" makes the job hang on a prompt for
      # ssh_public_key instead.
      - name: 'Retrieve Home IP from Key Vault'
        run: |
          HOME_IP=$(az keyvault secret show \
            --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} \
            --name HomeIP \
            --query value \
            --output tsv)
          echo "::add-mask::$HOME_IP"
          echo "HOME_IP=$HOME_IP" >> $GITHUB_ENV

      - name: 'Retrieve SSH Public Key'
        run: |
          SSH_KEY=$(az sshkey show \
            --resource-group rg-nygdev-security \
            --name nygdev-ed25519 \
            --query publicKey \
            --output tsv)
          echo "SSH_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - run: mkdir -p $TF_PLUGIN_CACHE_DIR

      - uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-tf-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-tf-

      - name: 'Terraform Init'
        working-directory: terraform
        run: terraform init

      # Always, in both modes. The apply below runs this saved plan file rather
      # than re-planning, so what gets applied is exactly what was printed here —
      # no window between the two for drift or for someone else's apply to
      # change the answer.
      #
      # -detailed-exitcode: 0 is "no changes", 2 is "changes to make", 1 is a
      # real error. Distinguishing the first two is what lets the apply step skip
      # a no-op instead of taking the state lock to do nothing.
      - name: 'Terraform Plan'
        id: plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode \
            -lock-timeout="$TF_LOCK_TIMEOUT" \
            -out=gymbro.tfplan \
            $TF_TARGETS \
            -var="home_ip=$HOME_IP" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="admin_username=${{ secrets.AZURE_VM_USERNAME }}"
          code=$?
          set -e

          case "$code" in
            0)
              echo "No changes. The gymbro slice matches the configuration."
              echo "changes=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "changes=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$code"
              ;;
          esac

      # "Resource targeting is in effect" is printed by the plan above every
      # time. It is expected here rather than a warning to act on, and this note
      # is in the log so the next person reading it does not have to work that
      # out. The line that does matter is any `must be replaced` against the
      # function app or its identity — see the header.
      - name: 'Note on the targeting warning'
        run: |
          echo "::notice::Terraform's 'resource targeting is in effect' warning is expected in this workflow. What to check in the plan is whether azurerm_function_app_flex_consumption.api or azurerm_user_assigned_identity.api is being replaced rather than updated; if so, cancel and use the full Terraform Apply, which includes the role assignments that hang off them."

      - name: 'Terraform Apply'
        if: inputs.mode == 'apply' && steps.plan.outputs.changes == 'true'
        working-directory: terraform
        run: |
          # The saved plan carries its own variables and targets, so none are
          # repeated here — passing them again is an error, not a belt and
          # braces.
          terraform apply -no-color -lock-timeout="$TF_LOCK_TIMEOUT" gymbro.tfplan

      # The two things a person needs after this runs, printed rather than
      # looked up. The hostname is what AZURE_SWA_NAME_GYMBRO's app resolves to
      # and what has to be in the API's CORS list; the redirect URIs are the
      # manual Entra step that no apply can do — the GymLog registration is not
      # managed by this configuration.
      #
      # `terraform output` reads state and does not plan, so it is unaffected by
      # the targeting above. It is guarded because on a first-ever plan-only run
      # the resource is not in state yet and the lookup is a legitimate failure.
      - name: 'What to do by hand'
        if: always() && steps.plan.conclusion == 'success'
        working-directory: terraform
        run: |
          echo "--- gymbro Static Web App hostname ---"
          terraform output -raw gymbro_static_site_hostname 2>/dev/null \
            || echo "(not in state yet — run this workflow with mode=apply)"
          echo
          echo "--- SPA redirect URIs to register on the GymLog registration ---"
          echo "App registrations -> GymLog -> Authentication -> Single-page application"
          terraform output -json gymlog_spa_redirect_uri 2>/dev/null \
            || echo "(not in state yet)"
