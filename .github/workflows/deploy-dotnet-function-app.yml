name: Deploy Dotnet Function App

on:
  push:
    branches: [main]
    paths:
      - 'dotnetfunctionapp/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish function app
        run: |
          dotnet publish dotnetfunctionapp \
            --configuration Release \
            --output publish

      - name: Package function app
        run: |
          cd publish
          zip -r ../dotnetfunctionapp.zip .

      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Flex Consumption)
        run: |
          az functionapp deployment source config-zip \
            --resource-group rg-nygdev-consumption \
            --name func-nygdev-logger \
            --src dotnetfunctionapp.zip
