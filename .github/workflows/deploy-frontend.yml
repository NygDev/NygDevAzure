name: Deploy Frontend
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    steps:
      - uses: actions/checkout@v4
      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch Static Web App deployment token
        id: swa
        run: |
          # The Static Web App is provisioned outside Terraform. Discover it by its
          # default hostname (the prefix Azure also used to name the original
          # auto-generated workflow) so we don't hard-code a resource name/RG.
          read -r NAME RG <<< "$(az staticwebapp list \
            --query "[?starts_with(defaultHostname, 'white-cliff-0068f5803')].[name, resourceGroup]" \
            -o tsv)"
          if [ -z "$NAME" ] || [ -z "$RG" ]; then
            echo "Could not locate the Static Web App (hostname prefix white-cliff-0068f5803)." >&2
            az staticwebapp list --query "[].{name:name, host:defaultHostname, rg:resourceGroup}" -o table >&2 || true
            exit 1
          fi
          echo "Found Static Web App '$NAME' in resource group '$RG'."
          echo "--- Static Web App diagnostics ---"
          az staticwebapp show --name "$NAME" --resource-group "$RG" \
            --query "{name:name, host:defaultHostname, location:location, sku:sku.name, provider:provider, repositoryUrl:repositoryUrl, branch:branch}" \
            -o jsonc || true
          echo "--- All Static Web Apps in subscription ---"
          az staticwebapp list --query "[].{name:name, host:defaultHostname, rg:resourceGroup, provider:provider}" -o table || true
          TOKEN="$(az staticwebapp secrets list --name "$NAME" --resource-group "$RG" \
            --query "properties.apiKey" -o tsv)"
          if [ -z "$TOKEN" ]; then
            echo "Failed to retrieve deployment token for '$NAME'." >&2
            exit 1
          fi
          echo "Retrieved deployment token (length: ${#TOKEN} chars)."
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend
          output_location: ""
          skip_api_build: true
