name: Deploy Frontend
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    steps:
      - uses: actions/checkout@v4
      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload frontend to storage static website ($web)
        run: |
          # The frontend is hosted on the nygdevcdn storage account's static
          # website ($web container), served at nygdevcdn.z1.web.core.windows.net.
          # The deploy identity has Contributor on the subscription, so it can list
          # the account key (matching how the Function Apps authenticate to storage).
          KEY="$(az storage account keys list \
            --account-name nygdevcdn \
            --resource-group rg-nygdev-web \
            --query "[0].value" -o tsv)"
          echo "::add-mask::$KEY"
          az storage blob upload-batch \
            --account-name nygdevcdn \
            --account-key "$KEY" \
            --destination '$web' \
            --source frontend \
            --overwrite
