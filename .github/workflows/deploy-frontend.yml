name: Deploy Frontend
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    steps:
      - uses: actions/checkout@v4
      - name: Az CLI login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload frontend to storage static website ($web)
        run: |
          # The frontend is hosted on the nygdevcdn storage account's static
          # website ($web container), served at nygdevcdn.z1.web.core.windows.net.
          # nygdevcdn has shared-key access disabled, so upload over Entra ID
          # (--auth-mode login). This requires the deploy identity to hold the
          # "Storage Blob Data Contributor" role on the nygdevcdn account.
          az storage blob upload-batch \
            --account-name nygdevcdn \
            --auth-mode login \
            --destination '$web' \
            --source frontend \
            --overwrite
