name: Deploy PS Function App
on:
  push:
    branches: [master]
    paths:
      - 'psfunctionapp/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    steps:
      - uses: actions/checkout@v7

      - name: Bundle Az modules into package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path psfunctionapp/Modules | Out-Null
          Save-Module -Name Az.Accounts -Path psfunctionapp/Modules -Repository PSGallery -Force
          Save-Module -Name Az.Storage  -Path psfunctionapp/Modules -Repository PSGallery -Force

      - name: Az CLI login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: func-nygdev-azadmin
          package: psfunctionapp
