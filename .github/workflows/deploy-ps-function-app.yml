name: Deploy PS Function App
on:
  push:
    branches: [master]
    paths:
      - 'psfunctionapp/**'
      - '.github/workflows/deploy-ps-function-app.yml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NygDevAzure
    steps:
      - uses: actions/checkout@v7

      # No Az modules to bundle: the functions call the Blob REST API directly
      # (psfunctionapp/Modules/FoundryCache), so the package is the scripts.

      - name: Az CLI login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: func-nygdev-azadmin
          package: psfunctionapp
