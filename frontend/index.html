<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    p  { color: #9ca3af; font-size: 0.875rem; }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    #user-info { font-size: 0.8rem; color: #6b7280; text-align: right; }
    #user-name  { color: #d1d5db; font-weight: 500; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: 0.85; }

    #btn-login  { background: #3b82f6; color: #fff; }
    #btn-logout { background: transparent; color: #6b7280; border: 1px solid #374151; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    #btn-submit { background: #10b981; color: #fff; width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem; }

    main {
      width: 100%;
      max-width: 480px;
    }

    #login-view {
      text-align: center;
      padding: 3rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #log-view { display: none; flex-direction: column; gap: 1rem; }

    form { display: flex; flex-direction: column; gap: 0.75rem; }

    label { font-size: 0.8rem; color: #9ca3af; display: flex; flex-direction: column; gap: 0.3rem; }

    input, textarea, select {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      color: #f9fafb;
      font-size: 1rem;
      padding: 0.65rem 0.75rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
    textarea { resize: vertical; min-height: 80px; }

    #status {
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.2rem;
      padding: 0.5rem;
      border-radius: 0.4rem;
    }
    #status.ok    { color: #10b981; background: #064e3b22; }
    #status.error { color: #f87171; background: #7f1d1d22; }
    #status.info  { color: #93c5fd; }
  </style>
</head>
<body>
  <header>
    <h1>Gym Log</h1>
    <div id="user-info" hidden>
      <div id="user-name"></div>
      <button id="btn-logout">Sign out</button>
    </div>
  </header>

  <main>
    <div id="login-view">
      <p>Sign in to log your sessions</p>
      <button id="btn-login">Sign in</button>
    </div>

    <div id="log-view">
      <form id="session-form">
        <label>
          Exercise
          <input id="exercise" type="text" placeholder="e.g. Bench press" autocomplete="off" required />
        </label>
        <label>
          Sets × Reps
          <input id="sets" type="text" placeholder="e.g. 4×8 @ 80kg" autocomplete="off" />
        </label>
        <label>
          Notes
          <textarea id="notes" placeholder="How it felt, PRs, etc."></textarea>
        </label>
        <button id="btn-submit" type="submit">Log session</button>
      </form>
      <div id="status"></div>
    </div>
  </main>

  <script src="https://alcdn.msauth.net/browser/3.26.0/js/msal-browser.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
