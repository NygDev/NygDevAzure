<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1116">
  <title>Gym Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- MSAL v5 (pinned). Bump version intentionally; check https://www.npmjs.com/package/@azure/msal-browser -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.9.0/lib/msal-browser.min.js"></script>
  <script src="db.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --err: #f85149;
      --warn: #d29922;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .stack {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .net-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      padding: 0 2px;
    }
    .net-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ok);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .net-dot.offline { background: var(--err); }
    .pending-badge {
      background: var(--warn);
      color: #0e1116;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
      display: none;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    button {
      font-family: var(--mono);
      font-size: 13px;
      background: var(--accent);
      color: #0e1116;
      border: 0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status { font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 16px; }
    .status.ok   { color: var(--ok); }
    .status.err  { color: var(--err); }
    .status.warn { color: var(--warn); }
    pre {
      background: #0a0d12;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      overflow: auto;
      max-height: 400px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    textarea {
      font-family: var(--mono);
      font-size: 12px;
      background: #0a0d12;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      width: 100%;
      resize: vertical;
      min-height: 140px;
      outline: none;
      margin-bottom: 12px;
    }
    textarea:focus { border-color: var(--accent); }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 16px 0 6px;
    }
  </style>
</head>
<body>
  <div class="stack">

    <!-- Network status bar -->
    <div class="net-bar">
      <div id="net-dot" class="net-dot"></div>
      <span id="net-label">Online</span>
      <span id="pending-badge" class="pending-badge"></span>
    </div>

    <!-- HttpTrigger card -->
    <div class="card">
      <h1>HttpTrigger</h1>
      <div class="sub">POST with bearer token — logs token claims to Cosmos</div>

      <div class="row">
        <button id="run" disabled>Run test</button>
        <button id="signout" class="secondary">Sign out</button>
      </div>

      <div id="status" class="status">Initialising…</div>

      <div class="label">Response</div>
      <pre id="out">—</pre>
    </div>

    <!-- GetExercises card -->
    <div class="card">
      <h1>GetExercises</h1>
      <div class="sub">GET — returns the user's exercise list, seeding defaults if none exists</div>

      <div class="row">
        <button id="exercises-run" disabled>Get exercises</button>
      </div>

      <div id="exercises-status" class="status"></div>

      <div class="label">Response</div>
      <pre id="exercises-out">—</pre>
    </div>

    <!-- LogLiftSession card -->
    <div class="card">
      <h1>LogLiftSession</h1>
      <div class="sub">POST any JSON body — queued locally and synced to Cosmos</div>

      <div class="label">Request body</div>
      <textarea id="lift-body">{
  "exercise": "squat",
  "sets": [
    { "reps": 5, "weightKg": 100 }
  ]
}</textarea>

      <div class="row">
        <button id="lift-run" disabled>Send</button>
      </div>

      <div id="lift-status" class="status"></div>

      <div class="label">Response</div>
      <pre id="lift-out">—</pre>
    </div>

  </div>

  <script>
    // -------- CONFIG -------- //
    const TENANT_ID        = "0533c1fa-9751-48df-b526-d82df80a8797";
    const CLIENT_ID        = "b871e062-cdbf-417c-8e91-6d23d0189ce5";
    const API_APP_ID       = "b871e062-cdbf-417c-8e91-6d23d0189ce5";
    const HTTPTRIGGER_URL  = "https://func-nygdev-logger.azurewebsites.net/api/HttpTrigger";
    const LOGLIFT_URL      = "https://func-nygdev-logger.azurewebsites.net/api/LogLiftSession";
    const GETEXERCISES_URL = "https://func-nygdev-logger.azurewebsites.net/api/GetExercises";
    // ------------------------ //

    const scopes = [`api://${API_APP_ID}/.default`];

    const pca = new msal.PublicClientApplication({
      auth: {
        clientId: CLIENT_ID,
        authority: `https://login.microsoftonline.com/${TENANT_ID}`,
        redirectUri: window.location.origin,
        navigateToLoginRequestUrl: false
      },
      cache: { cacheLocation: "localStorage" }
    });

    let msalReady = false;

    // ---- DOM refs ---- //
    const statusEl        = document.getElementById("status");
    const outEl           = document.getElementById("out");
    const runBtn          = document.getElementById("run");
    const signoutBtn      = document.getElementById("signout");
    const liftStatus      = document.getElementById("lift-status");
    const liftOut         = document.getElementById("lift-out");
    const liftRun         = document.getElementById("lift-run");
    const liftBody        = document.getElementById("lift-body");
    const exercisesStatus = document.getElementById("exercises-status");
    const exercisesOut    = document.getElementById("exercises-out");
    const exercisesRun    = document.getElementById("exercises-run");
    const netDot          = document.getElementById("net-dot");
    const netLabel        = document.getElementById("net-label");
    const pendingBadge    = document.getElementById("pending-badge");

    // ---- Network status ---- //
    function updateNetworkStatus() {
      const online = navigator.onLine;
      netDot.className  = "net-dot" + (online ? "" : " offline");
      netLabel.textContent = online ? "Online" : "Offline";
    }

    async function updatePendingBadge() {
      const q = await getQueue();
      if (q.length > 0) {
        pendingBadge.textContent = `${q.length} pending`;
        pendingBadge.style.display = "";
      } else {
        pendingBadge.style.display = "none";
      }
    }

    updateNetworkStatus();
    window.addEventListener("online",  () => { updateNetworkStatus(); drainQueue(); });
    window.addEventListener("offline", updateNetworkStatus);

    // ---- Helpers ---- //
    function setStatus(el, msg, kind = "") {
      el.textContent = msg;
      el.className   = "status " + kind;
    }

    function renderResponse(preEl, res, text) {
      let body;
      try { body = JSON.stringify(JSON.parse(text), null, 2); }
      catch { body = text; }
      preEl.textContent = `HTTP ${res.status} ${res.statusText}\n\n${body}`;
    }

    // Redirect-capable token acquisition for user-initiated actions.
    async function acquireToken(pendingAction) {
      const account = pca.getAllAccounts()[0];
      if (!account) {
        if (pendingAction) sessionStorage.setItem("pending-action", pendingAction);
        await pca.loginRedirect({ scopes });
        return null;
      }
      try {
        return (await pca.acquireTokenSilent({ scopes, account })).accessToken;
      } catch (e) {
        if (e instanceof msal.InteractionRequiredAuthError) {
          if (pendingAction) sessionStorage.setItem("pending-action", pendingAction);
          await pca.acquireTokenRedirect({ scopes, account });
          return null;
        }
        throw e;
      }
    }

    // Silent-only — used for background sync; never redirects.
    async function acquireTokenSilent() {
      if (!msalReady) return null;
      const account = pca.getAllAccounts()[0];
      if (!account) return null;
      try {
        return (await pca.acquireTokenSilent({ scopes, account })).accessToken;
      } catch {
        return null;
      }
    }

    // ---- Sync queue ---- //
    async function drainQueue() {
      const pending = await getQueue();
      if (!pending.length) return;

      const token = await acquireTokenSilent();
      if (!token) return;

      for (const item of pending) {
        try {
          const res = await fetch(item.url, {
            method: "POST",
            headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
            body: JSON.stringify(item.body)
          });
          if (res.ok) {
            await dequeue(item.localId);
          } else if (res.status >= 500) {
            break; // transient server error — retry later
          } else {
            await dequeue(item.localId); // 4xx: unrecoverable, discard
          }
        } catch {
          break; // network gone again — stop
        }
      }
      await updatePendingBadge();
    }

    // ---- Function calls ---- //
    async function callHttpTrigger() {
      setStatus(statusEl, "Acquiring token…");
      const token = await acquireToken("run-test");
      if (!token) return;

      setStatus(statusEl, "Calling function…");
      const res  = await fetch(HTTPTRIGGER_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ id: "test-from-browser" })
      });
      const text = await res.text();
      renderResponse(outEl, res, text);
      setStatus(statusEl, res.ok ? "Success." : `Request failed (${res.status}).`, res.ok ? "ok" : "err");
    }

    async function callGetExercises() {
      if (!navigator.onLine) {
        const cached = await getCached("exercises");
        if (cached) {
          exercisesOut.textContent = JSON.stringify(cached, null, 2);
          setStatus(exercisesStatus, "Offline — showing cached exercises.", "warn");
        } else {
          setStatus(exercisesStatus, "Offline and no cached data.", "err");
        }
        return;
      }

      setStatus(exercisesStatus, "Acquiring token…");
      const token = await acquireToken("get-exercises");
      if (!token) return;

      setStatus(exercisesStatus, "Fetching…");
      try {
        const res  = await fetch(GETEXERCISES_URL, {
          headers: { "Authorization": "Bearer " + token }
        });
        const text = await res.text();
        renderResponse(exercisesOut, res, text);
        if (res.ok) await setCached("exercises", JSON.parse(text));
        setStatus(exercisesStatus, res.ok ? "Success." : `Request failed (${res.status}).`, res.ok ? "ok" : "err");
      } catch {
        const cached = await getCached("exercises");
        if (cached) {
          exercisesOut.textContent = JSON.stringify(cached, null, 2);
          setStatus(exercisesStatus, "Network error — showing cached exercises.", "warn");
        } else {
          setStatus(exercisesStatus, "Network error and no cached data.", "err");
        }
      }
    }

    async function callLogLiftSession() {
      let parsed;
      try {
        parsed = JSON.parse(liftBody.value);
      } catch {
        setStatus(liftStatus, "Invalid JSON in request body.", "err");
        return;
      }

      // Queue first — the write is safe even if we lose connection mid-flight.
      const localId = await enqueue(LOGLIFT_URL, parsed);
      await updatePendingBadge();

      const token = await acquireToken("log-lift");
      if (!token) return; // redirecting to login; item is already queued

      setStatus(liftStatus, "Sending…");
      try {
        const res  = await fetch(LOGLIFT_URL, {
          method: "POST",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify(parsed)
        });
        const text = await res.text();
        if (res.ok) {
          await dequeue(localId);
          renderResponse(liftOut, res, text);
          setStatus(liftStatus, "Success.", "ok");
        } else {
          renderResponse(liftOut, res, text);
          setStatus(liftStatus, `Request failed (${res.status}) — queued for retry.`, "err");
        }
      } catch {
        setStatus(liftStatus, "Offline — queued for sync.", "warn");
      }
      await updatePendingBadge();
    }

    // ---- Event listeners ---- //
    runBtn.addEventListener("click", async () => {
      runBtn.disabled = true; outEl.textContent = "—";
      try { await callHttpTrigger(); }
      catch (e) { outEl.textContent = String(e.stack || e); setStatus(statusEl, "Error: " + e.message, "err"); }
      finally { runBtn.disabled = false; }
    });

    exercisesRun.addEventListener("click", async () => {
      exercisesRun.disabled = true; exercisesOut.textContent = "—";
      try { await callGetExercises(); }
      catch (e) { exercisesOut.textContent = String(e.stack || e); setStatus(exercisesStatus, "Error: " + e.message, "err"); }
      finally { exercisesRun.disabled = false; }
    });

    liftRun.addEventListener("click", async () => {
      liftRun.disabled = true; liftOut.textContent = "—";
      try { await callLogLiftSession(); }
      catch (e) { liftOut.textContent = String(e.stack || e); setStatus(liftStatus, "Error: " + e.message, "err"); }
      finally { liftRun.disabled = false; }
    });

    signoutBtn.addEventListener("click", async () => {
      const account = pca.getAllAccounts()[0];
      if (!account) { setStatus(statusEl, "No active account."); return; }
      await pca.logoutRedirect({ account, postLogoutRedirectUri: window.location.origin });
    });

    // ---- Page load ---- //
    (async () => {
      // Register service worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(console.warn);
      }

      await updatePendingBadge();

      try {
        await pca.initialize();
        const response = await pca.handleRedirectPromise();
        if (response?.account) pca.setActiveAccount(response.account);

        msalReady = true;

        const acct = pca.getAllAccounts()[0];
        runBtn.disabled = false;
        liftRun.disabled = false;
        exercisesRun.disabled = false;

        // Flush any writes that were queued in a previous session.
        drainQueue();

        const pending = sessionStorage.getItem("pending-action");
        if (acct && pending) {
          sessionStorage.removeItem("pending-action");
          if (pending === "run-test") {
            setStatus(statusEl, `Signed in as ${acct.username}. Running test…`);
            await callHttpTrigger();
          } else if (pending === "get-exercises") {
            setStatus(exercisesStatus, `Signed in as ${acct.username}. Fetching…`);
            await callGetExercises();
          } else if (pending === "log-lift") {
            setStatus(liftStatus, `Signed in as ${acct.username}. Sending queued item…`);
            await drainQueue();
            const remaining = await getQueue();
            await updatePendingBadge();
            setStatus(liftStatus, remaining.length === 0 ? "Sent." : "Queued — retrying later.", remaining.length === 0 ? "ok" : "warn");
          }
          return;
        }

        setStatus(statusEl, acct
          ? `Signed in as ${acct.username}. Ready.`
          : "Not signed in. Click a button to sign in.");
      } catch (e) {
        setStatus(statusEl, "MSAL init failed: " + e.message, "err");
        runBtn.disabled = true;
        liftRun.disabled = true;
        exercisesRun.disabled = true;
      }
    })();
  </script>
</body>
</html>
