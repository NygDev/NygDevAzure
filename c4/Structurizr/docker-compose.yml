# NygDev Structurizr  ->  http://localhost:8081
# Bring up: docker compose up -d --build

name: nygdev-c4

services:
  nygdev-c4:
    build:
      context: .
      args:
        STRUCTURIZR_REF: v2026.05.16
        APP_REVISION: 1.0.0
    image: nygdev-c4:v2026.05.16
    container_name: nygdev-c4
    ports:
      - "8081:8080"
    volumes:
      - ./data:/usr/local/structurizr
    restart: unless-stopped
