# Structurizr on-premises configuration.
# Docs: https://docs.structurizr.com/onpremises/configuration
#
# Changes require a container restart:  docker compose restart nygdev-c4
#
# ---------------------------------------------------------------------------
# Workspace versioning
# ---------------------------------------------------------------------------
# How many previous versions of each workspace the server retains on disk
# (default 30). Set to 0 to retain none - what we want while the workspaces
# are under active development, otherwise every DSL push leaves another
# workspace-<timestamp>.json archive in data/<id>/.
#
# Behaviour (server v2026.05.16): putWorkspace() unconditionally writes a
# workspace-<timestamp>.json snapshot on every save - there is no setting
# that skips that write. Retention is trimmed separately by
# removeOldWorkspaceVersions(), which keeps the newest <maxversions> snapshots
# and deletes the rest; with 0 they are all pruned, so none are kept.
# updateWorkspaces.ps1 prunes these archives too, as belt-and-braces.
#
# IMPORTANT: the property is "structurizr.workspace.maxversions" (constant
# StructurizrProperties.MAX_WORKSPACE_VERSIONS). The name used here before,
# "structurizr.maxWorkspaceVersions", is not a real property - the server
# ignored it and used the default of 30, so versioning was never actually off.
structurizr.workspace.maxversions=0
