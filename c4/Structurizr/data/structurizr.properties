# Structurizr on-premises configuration.
# Docs: https://docs.structurizr.com/onpremises/configuration
#
# Changes require a container restart:  docker compose restart nygdev-c4
#
# ---------------------------------------------------------------------------
# Workspace versioning
# ---------------------------------------------------------------------------
# How many previous versions of each workspace the server keeps on disk.
# Default is 30. Set to 0 to stop creating archive snapshots entirely.
#
# Disabled while workspaces are under active development - every DSL edit
# would otherwise generate a new archive file in data/<id>/. Turn this back
# on once the workspaces are stable (e.g. set the value to 30, or comment
# the line out to use the default).
#
# NOTE: the property is "structurizr.maxWorkspaceVersions" - the previous
# name (structurizr.workspace.maxversions) was unrecognised, so the server
# silently fell back to the default of 30 and kept archiving every edit.
structurizr.maxWorkspaceVersions=0
